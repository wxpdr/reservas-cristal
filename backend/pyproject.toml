[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reservas-cristal-backend"
version = "0.1.0"
description = "API do sistema interno Reservas Cristal"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]
